services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password123
      OIDC_ENABLED: "false"
    depends_on:
      - redis
      - neo4j
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 5s
      retries: 5

  agent-a:
    build:
      context: ./client/agent
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
      - "9001:9001/udp"
    environment:
      SERVER_URL: http://server:8080
      PEER_ID: agent-a
      AGENT_API_URL: http://agent-a:8000
      UDP_PORT: 9001
      UDP_HOST: 0.0.0.0
      UDP_ADVERTISE_HOST: agent-a
      STORAGE_PATH: /data
    volumes:
      - agent_a_data:/data
    depends_on:
      server:
        condition: service_healthy

  agent-b:
    build:
      context: ./client/agent
      dockerfile: Dockerfile
    ports:
      - "8002:8000"
      - "9002:9001/udp"
    environment:
      SERVER_URL: http://server:8080
      PEER_ID: agent-b
      AGENT_API_URL: http://agent-b:8000
      UDP_PORT: 9001
      UDP_HOST: 0.0.0.0
      UDP_ADVERTISE_HOST: agent-b
      STORAGE_PATH: /data
    volumes:
      - agent_b_data:/data
    depends_on:
      server:
        condition: service_healthy

volumes:
  agent_a_data:
  agent_b_data:
